# =====================================================================
# External Runtime Database Configuration
# Subsea Pipeline Integrity Diagnostics System
# =====================================================================

# ---------------------------------------------------------------------
# REMOTE DATABASE HOST (FRIEND'S LAPTOP OR OCI VM 2)
# Replace 'localhost' with your friend's laptop IPv4 address (e.g. 192.168.1.50)
# ---------------------------------------------------------------------
db.host=127.0.0.1
db.port=3306

# Primary Database (used by Student 2 Pipeline Dashboard & Ingestion)
# Set to 'subsea_db' for Student 2 pipeline or 'subsea_pipeline' for Student 1 core
db.name=subsea_db

# Application Database Credentials configured on Friend's Laptop
db.user=subsea_user
db.username=subsea_user
db.password=SubseaSecurePass2026!

# Alternative Student 1 baseline credentials (if friend hosts subsea_pipeline):
# db.name=subsea_pipeline
# db.username=subsea_app
# db.password=SubseaApp@2026#ChangeMe

# JDBC Driver & Network Settings
db.driver=com.mysql.cj.jdbc.Driver
db.useSSL=false
db.allowPublicKeyRetrieval=true
db.serverTimezone=UTC
db.connectionTimeoutMs=5000

# Concurrency & Reporting Settings
app.worker.threadPoolSize=4
app.report.outputDir=reports/
